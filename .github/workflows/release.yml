name: Release

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  upload-artifacts:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Check out the immutable release tag so the packaged version exactly matches
      # the GitHub release created by release-please.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run dist:mac

      - run: gh release upload "${{ needs.release-please.outputs.tag_name }}" release/*.dmg release/*.zip --clobber

      # release-please's notes are just the changelog, and it names the release
      # after the bare tag — restore both by hand, same as the old
      # scripts/release.mjs always did, so a draft never ships without them.
      - name: Set release title and append install instructions
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          dmg=$(basename release/*.dmg)
          gh release view "$TAG" --json body -q .body > notes.md
          cat >> notes.md <<EOF

          ## Install

          Download \`$dmg\`, drag Folio to Applications, then run once:

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/Folio.app
          \`\`\`

          This build is not code-signed, so macOS Gatekeeper needs that one-time nudge.
          EOF
          gh release edit "$TAG" --title "Folio $TAG" --notes-file notes.md

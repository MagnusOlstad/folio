name: Release

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  upload-artifacts:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      # Check out the immutable release tag so the packaged version exactly matches
      # the GitHub release created by release-please.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate signing credentials
        run: |
          test -n "${CSC_LINK:-}" || { echo "MACOS_CERTIFICATE_P12 is required" >&2; exit 1; }
          test -n "${CSC_KEY_PASSWORD:-}" || { echo "MACOS_CERTIFICATE_PASSWORD is required" >&2; exit 1; }
          test -n "${APPLE_API_KEY_P8:-}" || { echo "APPLE_API_KEY_P8 is required" >&2; exit 1; }
          test -n "${APPLE_API_KEY_ID:-}" || { echo "APPLE_API_KEY_ID is required" >&2; exit 1; }
          test -n "${APPLE_API_ISSUER:-}" || { echo "APPLE_API_ISSUER is required" >&2; exit 1; }

      - name: Prepare App Store Connect API key
        run: |
          key_path="${RUNNER_TEMP}/folio-notary-api-key.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - run: npm run dist:mac

      - name: Verify signed and notarized artifacts
        run: |
          app_path="release/mac-arm64/Folio.app"
          dmg_path=$(printf '%s\n' release/*.dmg | head -n 1)
          test -d "$app_path"
          test -f "$dmg_path"
          test -f release/latest-mac.yml
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"

      # Keep the release as a draft so artifact and release-note checks remain
      # the final human publish checkpoint.
      - name: Upload signed artifacts
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" release/*.dmg release/*.zip release/latest-mac.yml --clobber

      # release-please's notes are just the changelog, and it names the release
      # after the bare tag — restore both by hand, same as the old
      # scripts/release.mjs always did, so a draft never ships without them.
      - name: Set release title and append install instructions
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          dmg=$(basename release/*.dmg)
          gh release view "$TAG" --json body -q .body > notes.md
          cat >> notes.md <<EOF

          ## Install

          Download \`$dmg\`, open it, and drag Folio to Applications. This release is
          signed with an Apple Developer ID certificate and notarized by Apple, so
          macOS Gatekeeper can verify it normally.
          EOF
          gh release edit "$TAG" --title "Folio $TAG" --notes-file notes.md

      - name: Remove temporary notarization key
        if: always()
        run: rm -f "${APPLE_API_KEY_PATH:-${RUNNER_TEMP}/folio-notary-api-key.p8}"

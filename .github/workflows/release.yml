name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bump version
        run: |
          case "${{ inputs.bump }}" in
            patch|minor|major) npm version "${{ inputs.bump }}" --no-git-tag-version ;;
            *) echo "Invalid bump: ${{ inputs.bump }}" >&2; exit 1 ;;
          esac

      - name: Commit, tag, and push
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "release: $TAG"
          git tag -a "$TAG" -m "Folio $TAG"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "$TAG"

      - name: Build and publish draft release
        run: |
          npm run build
          npx electron-builder --mac --arm64 --publish always
